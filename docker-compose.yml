# version: '3.8' ---- this is deprecated

services:
  # ---- Kafka ------------
  # The "Nervous System" - Local Mock Kafka (KRaft Mode, No Zookeeper) 
  kafka:
    image: apache/kafka:latest
    container_name: local-mock-broker
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://local-mock-broker:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@local-mock-broker:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

    networks:
      - agent_network

  # The "Senses" - Apache NiFi 2.x
  nifi:
    image: apache/nifi:latest
    container_name: local-nifi-senses
    ports:
      - "8443:8443" # NiFi 2.x defaults to secure HTTPS
    environment:
      SINGLE_USER_CREDENTIALS_USERNAME: admin
      SINGLE_USER_CREDENTIALS_PASSWORD: AgenticPassword123!
    depends_on:
      - kafka
    networks:
      - agent_network

# --- The Brain (Apache Flink) ---
  jobmanager:
    build: .
    container_name: jobmanager
    ports:
    - "8081:8081"
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
    volumes:
      - ./flink_sql:/opt/flink/usrlib
    networks:
      - agent_network

  taskmanager:
    build: .
    depends_on:
      - jobmanager
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 2
    networks:
      - agent_network

  # --- The SQL Client (Where we run the queries) ---
  sql-client:
    build: .
    depends_on:
      - jobmanager
      - kafka
    environment:
      - FLINK_PROPERTIES=jobmanager.rpc.address:jobmanager
      - REST_ADDRESS=jobmanager 
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - MONGO_URI=${MONGO_URI}
    volumes:
      - ./flink_sql:/opt/flink/sql
    networks:
      - agent_network
# --- Top Level Network ---
networks:
  agent_network:
    driver: bridge
